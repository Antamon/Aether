    <!-- Charactersheet nav -->
    <div class="container d-none" id="pageNav"></div>
    <div class="container aether-page d-none" id="characterDeleteActions"></div>

    <!-- Charactersheet body -->
    <div class="container aether-page" id="sheetBody">
        <div class="row">
            <!-- Start character form -->
            <div class="col-lg-6 col-12">
                <div class="d-none" id="characterForm">
                    <div class="card aether-panel character-sheet-card mb-4">
                        <div class="card-body">
                            <div class="character-sheet-header mb-3">
                                <div class="character-portrait-panel">
                                    <div class="character-portrait-frame">
                                        <img
                                            id="characterPortraitImage"
                                            class="character-portrait-image d-none"
                                            src=""
                                            alt="Portret personage"
                                        >
                                        <div id="characterPortraitPlaceholder" class="character-portrait-placeholder">Geen portret</div>
                                    </div>
                                    <div class="character-portrait-actions">
                                        <input type="file" id="characterPortraitFileInput" class="d-none" accept="image/*">
                                        <div class="button-group">
                                            <button type="button" class="action-button" id="characterPortraitUploadButton" title="Portret opladen" aria-label="Portret opladen"><i class="fa-solid fa-upload"></i></button>
                                            <button type="button" class="action-button" id="characterPortraitDeleteButton" title="Portret verwijderen" aria-label="Portret verwijderen"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div class="character-sheet-header-fields">
                                    <div class="mb-3 row" id="classRow">
                                        <label class="col-sm-4 col-form-label">Klasse</label>
                                        <div class="col-sm-8">
                                            <select class="form-select" id="class" name="class">
                                                <option value="upper class">Bovenklasse</option>
                                                <option value="middle class" selected>Middenklasse</option>
                                                <option value="lower class">Onderklasse</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-4 col-form-label">Aanspreking</label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" id="title" name="title">
                                        </div>
                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-4 col-form-label">Familienaam</label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" id="lastName" name="lastName">
                                        </div>
                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-4 col-form-label">Voornaam</label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" id="firstName" name="firstName">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label">Straat en nummer</label>
                                <div class="col-sm-6">
                                    <input type="text" class="form-control" id="street" name="street">
                                </div>
                                <div class="col-sm-2">
                                    <input type="text" class="form-control" id="houseNumber" name="houseNumber">
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label">Postcode en gemeente</label>
                                <div class="col-sm-2">
                                    <input type="text" class="form-control" id="postalCode" name="postalCode">
                                </div>
                                <div class="col-sm-6">
                                    <input type="text" class="form-control" id="municipality" name="municipality">
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label">Burgelijke staat</label>
                                <div class="col-sm-8">
                                    <select class="form-select" id="maritalStatus" name="maritalStatus">
                                        <option value="Single" selected>Ongehuwd</option>
                                        <option value="Married">Gehuwd</option>
                                        <option value="Widowed">Weduwnaar/weduwe</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label">Nationaliteit</label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" id="nationality" name="nationality">
                                </div>
                            </div>
                            <div class="mb-3 row" id="birthRow">
                                <label class="col-sm-4 col-form-label">Geboren te / op</label>
                                <div class="col-sm-4">
                                    <input type="text" class="form-control" id="birthPlace" name="birthPlace">
                                </div>
                                <div class="col-sm-4">
                                    <input type="date" class="form-control" id="birthDate" name="birthDate">
                                </div>
                            </div>
                            <div class="d-none" id="leftTraitModuleHost"></div>
                            <div class="mb-3 row">
                                <label class="col-sm-4 col-form-label">Rijksregisternummer</label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" id="stateRegisterNumber" name="stateRegisterNumber">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card aether-panel character-sheet-card mb-4" id="leftInfoSections">
                        <div class="card-body">
                            <h4 class="character-sheet-card-title">Gezondheid</h4>
                            <div class="mb-4" id="healthSectionContent"></div>
                            <h4 class="character-sheet-card-title" id="livingStandardSectionTitle">Levensstandaard</h4>
                            <div class="mb-4" id="livingStandardSectionContent"></div>
                            <h4 class="character-sheet-card-title" id="staffSectionTitle">Personeel</h4>
                            <div class="mb-4" id="staffSectionContent"></div>
                            <h4 class="character-sheet-card-title" id="languagesSectionTitle">Talen</h4>
                            <div id="languagesSectionContent"></div>
                        </div>
                    </div>
                    <!-- Buttons new character -->
                    <div class="d-flex justify-content-center d-none" id="groupNewCharacter">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-primary" id="createNewCharacter"><i class="fa-solid fa-check"></i> Aanmaken</button>
                            <button type="button" class="btn btn-danger" id="cancelNewCharacter"><i class="fa-solid fa-xmark"></i> Annuleren</button>
                        </div>
                     </div>

                    <!-- Buttons edit existing character -->
                    <div class="d-flex justify-content-center d-none" id="groupEditCharacter">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-primary" id="updateCharacter"><i class="fa-solid fa-check"></i> Bewaar wijzigingen</button>
                        </div>
                    </div>

                </div>
            </div>

            <div class="col-lg-6 col-12">
                <div class="d-none" id="skills">
                    <div class="card aether-panel character-sheet-card mb-4">
                        <div class="card-body">
                            <h4 class="character-sheet-card-title">Vaardigheden</h4>
                            <div class="accordion mb-3" id="accordionSkills"></div>
                            <div class="input-group">
                                <label class="input-group-text action-group-label" for="idNewSkill">Vaardigheid toevoegen</label>
                                <select class="form-select" id="idNewSkill"></select>
                                <div class="button-group"><button class="action-button" type="button" id="addNewSkill" aria-label="Vaardigheid toevoegen"><i class="fa-solid fa-plus" aria-hidden="true"></i></button></div>
                            </div>
                        </div>
                    </div>
                    <div class="card aether-panel character-sheet-card" id="traitsSection">
                        <div class="card-body">
                            <h4 class="character-sheet-card-title">Statuseigenschappen</h4>
                            <div id="traitsContent"></div>
                        </div>
                    </div>
                </div>
            </div>     
        </div>

        <!-- Background tab content -->
        <div class="d-none w-100" id="backgroundTab">
            <div id="backgroundContent" class="mt-3"></div>
        </div>
        <!-- Diary tab content -->
        <div class="d-none w-100" id="diaryTab">
            <div id="diaryContent" class="mt-3"></div>
        </div>
        <!-- Personality tab content -->
        <div class="d-none w-100" id="personalityTab">
            <div id="personalityContent" class="mt-3"></div>
        </div>
        <!-- Economy tab content -->
        <div class="d-none w-100" id="economyTab">
            <div id="economyTabContent" class="mt-3"></div>
        </div>
        <!-- Actions tab content -->
        <div class="d-none w-100" id="actionsTab">
            <div id="actionsTabContent" class="mt-3"></div>
        </div>
        <!-- Passport tab content -->
        <div class="d-none w-100" id="passportTab">
            <div id="passportTabContent" class="mt-3"></div>
        </div>
    </div>
    </div>
    </div>


    <!-- Modal specialisation -->
    <div class="modal fade" id="specModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add specialisation</h5>
                <div class="button-group"><button type="button" class="action-button" data-bs-dismiss="modal" aria-label="Sluiten"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
            </div>

            <div class="modal-body">

                <!-- Tabs -->
                <ul class="nav nav-tabs mb-3" id="specTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active"
                            id="spec-existing-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#spec-existing-pane"
                            type="button"
                            role="tab"
                            aria-controls="spec-existing-pane"
                            aria-selected="true"
                            data-tab="existing">
                    Existing
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link"
                            id="spec-new-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#spec-new-pane"
                            type="button"
                            role="tab"
                            aria-controls="spec-new-pane"
                            aria-selected="false"
                            data-tab="new">
                    New
                    </button>
                </li>
                </ul>

                <div class="tab-content">
                <!-- Existing -->
                <div class="tab-pane fade show active"
                    id="spec-existing-pane"
                    role="tabpanel"
                    aria-labelledby="spec-existing-tab">
                    <div class="mb-3">
                    <label for="specSelect" class="form-label">Existing specialisation</label>
                    <select id="specSelect" class="form-select">
                        <!-- wordt via JS gevuld -->
                    </select>
                    </div>
                </div>

                <!-- New -->
                <div class="tab-pane fade"
                    id="spec-new-pane"
                    role="tabpanel"
                    aria-labelledby="spec-new-tab">
                    <div class="mb-3">
                    <label for="specCustom" class="form-label">New specialisation</label>
                    <input type="text"
                            id="specCustom"
                            class="form-control"
                            placeholder="">
                    </div>
                </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="button-group">
                    <button type="button" class="action-button" id="specSaveBtn"><i class="fa-solid fa-check" aria-hidden="true"></i> Save</button>
                    <button type="button" class="action-button" data-bs-dismiss="modal"><i class="fa-solid fa-xmark" aria-hidden="true"></i> Cancel</button>
                </div>
            </div>
            </div>
        </div>
    </div>

    <!-- Modal discipline -->
    <div class="modal fade" id="disciplineModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        Choose discipline for
                        <span id="disciplineSkillTitle" class="fw-bold"></span>
                    </h5>
                    <div class="button-group"><button type="button" class="action-button" data-bs-dismiss="modal" aria-label="Sluiten"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
                </div>

                <div class="modal-body">
                    <!-- Tabs -->
                    <ul class="nav nav-tabs mb-3" id="disciplineTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active"
                                    id="discipline-existing-tab"
                                    data-bs-toggle="tab"
                                    data-bs-target="#discipline-existing-pane"
                                    type="button"
                                    role="tab"
                                    aria-controls="discipline-existing-pane"
                                    aria-selected="true"
                                    data-tab="existing">
                                Existing
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link"
                                    id="discipline-new-tab"
                                    data-bs-toggle="tab"
                                    data-bs-target="#discipline-new-pane"
                                    type="button"
                                    role="tab"
                                    aria-controls="discipline-new-pane"
                                    aria-selected="false"
                                    data-tab="new">
                                New
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Existing -->
                        <div class="tab-pane fade show active"
                            id="discipline-existing-pane"
                            role="tabpanel"
                            aria-labelledby="discipline-existing-tab">
                            <div class="mb-3">
                                <label for="disciplineSelect" class="form-label">
                                    Existing discipline
                                </label>
                                <select id="disciplineSelect" class="form-select">
                                    <!-- wordt via JS gevuld -->
                                </select>
                            </div>
                        </div>

                        <!-- New -->
                        <div class="tab-pane fade"
                            id="discipline-new-pane"
                            role="tabpanel"
                            aria-labelledby="discipline-new-tab">
                            <div class="mb-3">
                                <label for="disciplineCustom" class="form-label">
                                    New discipline
                                </label>
                                <input type="text"
                                    id="disciplineCustom"
                                    class="form-control"
                                    placeholder="bv. Schrijnwerker, Trompet, ...">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <!-- belangrijk: GEEN data-bs-dismiss op Cancel
                        → als user wegklikt zonder keuze, registreren we de skill niet -->
                    <div class="button-group">
                        <button type="button" class="action-button" id="disciplineSaveBtn"><i class="fa-solid fa-check" aria-hidden="true"></i> Save</button>
                        <button type="button" class="action-button" id="disciplineCancelBtn"><i class="fa-solid fa-xmark" aria-hidden="true"></i> Cancel</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="languageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Taal kiezen</h5>
                    <div class="button-group"><button type="button" class="action-button" data-bs-dismiss="modal" aria-label="Sluiten"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
