<body data-sidebar-page="leaderPersonnel">
<nav class="navbar bg-dark bgRed mb-4 aether-top-nav" data-bs-theme="dark">
    <div class="container"><a class="navbar-brand" href="index.html" aria-label="Aether startpagina" data-i18n-aria-label="Aether startpagina"></a><ul class="navbar-nav me-auto"></ul><div id="navbarName"></div></div>
</nav>
<main class="container pb-5">
    <section class="card aether-panel shadow-sm"><div class="card-body">
        <h1><span data-i18n="Bedrijf">Bedrijf</span></h1>
        <div id="leaderPersonnelFeedback" class="alert d-none" role="status"></div>
        <label class="form-label" for="leaderCompanySelect"><span data-i18n="Bedrijf">Bedrijf</span></label>
        <select id="leaderCompanySelect" class="form-select mb-4"></select>
        <div id="leaderPersonnelManagement" class="d-none">
        <div id="leaderPersonnelList" class="row g-3"></div>
        <h2 class="h4 mt-4"><span data-i18n="Personeelslid toevoegen">Personeelslid toevoegen</span></h2>
        <form id="leaderPersonnelAddForm" class="row g-2">
            <div class="col-md-5"><label class="form-label" for="leaderCharacterSelect"><span data-i18n="Personage">Personage</span></label><select id="leaderCharacterSelect" class="form-select" required></select></div>
            <div class="col-md-3"><label class="form-label" for="leaderNewSalary"><span data-i18n="Loonsverhoging (%)">Loonsverhoging (%)</span></label><input id="leaderNewSalary" type="number" min="0" max="999999.99" step="0.01" value="0" class="form-control"></div>
            <div class="col-md-2 d-flex align-items-end"><label class="form-check mb-2"><input id="leaderNewBoard" type="checkbox" class="form-check-input"> <span data-i18n="Raad van bestuur">Raad van bestuur</span></label></div>
            <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit"><span data-i18n="Toevoegen">Toevoegen</span></button></div>
        </form>
        <p class="text-muted mt-3 mb-0"><span data-i18n="Een bedrijfsleider kan personeel, loonsverhoging en bestuurslidmaatschap aanpassen. Belangrijkheid en vaardigheden worden door een director of administrator beheerd.">Een bedrijfsleider kan personeel, loonsverhoging en bestuurslidmaatschap aanpassen. Belangrijkheid en vaardigheden worden door een director of administrator beheerd.</span></p>
        </div>
    </div></section>
    <section class="card aether-panel shadow-sm mt-4"><div class="card-body" id="leaderCompanyShares"></div></section>
</main>
