<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amarante&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=d6c84914ada31c61">
    <link rel="stylesheet" href="css/page-nav.css?v=848dffaa66c99a46">
    <link rel="stylesheet" href="css/modal.css?v=4b09b564482dbf3d">
    <title data-i18n="Aether applicatie">Aether applicatie</title>
<link rel="stylesheet" href="css/i18n.css?v=8ebfc8f07e0ed31c">
<script src="js/interface-copy.js?v=d70b1ecf9d44b6b7"></script>
<script src="js/i18n.js?v=13ca69d9a742769d"></script>
<script src="js/contentLanguage.js?v=b9b765844712fa46"></script>
<script src="js/translationUi.js?v=5f2704f03090a57d"></script>
</head>
<body data-sidebar-page="events">

    <!-- Shared header artwork and account controls -->
    <header class="aether-top-bar">
        <a class="aether-top-bar-home" href="index.html" aria-label="Aether startpagina" data-i18n-aria-label="Aether startpagina"></a>
        <div class="container"><div id="navbarName"></div></div>
    </header>

    <template id="eventSidebarContent">
        <div class="mb-3 d-none" id="participantFilterWrapper">
            <label class="form-label" for="eventParticipantSelect"><span data-i18n="Deelnames van deelnemer">Deelnames van deelnemer</span></label>
            <div id="eventParticipantFilterChoices"></div>
        </div>
        <div class="company-list event-sidebar-list" id="eventSidebarList"></div>
        <div class="button-group mt-3 d-none" id="eventCreateActions"><button class="action-button" type="button" id="eventCreateButton"><i class="fa-solid fa-plus" aria-hidden="true"></i> <span data-i18n="Nieuw event">Nieuw event</span></button></div>
    </template>
    <main class="container aether-page event-page">
        <div class="alert alert-danger d-none" id="eventFeedback" role="alert"></div>
        <div id="eventDetailsView" class="d-none"></div>
        <section class="aether-panel d-none" id="eventParticipationView">
            <h1 class="h3 mb-3" id="titleParticipant"><span data-i18n="Mijn deelnames">Mijn deelnames</span></h1>
            <div class="table-responsive">
                <table class="table aether-table align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Type</th><th scope="col"><span data-i18n="Titel">Titel</span></th><th scope="col"><span data-i18n="Beschrijving">Beschrijving</span></th>
                            <th scope="col"><span data-i18n="Datum">Datum</span></th><th scope="col"><span data-i18n="Locatie">Locatie</span></th><th scope="col">EP</th><th scope="col"><span data-i18n="Deelname">Deelname</span></th>
                        </tr>
                    </thead>
                    <tbody id="eventList"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/07b82e9825.js" crossorigin="anonymous"></script>
    <script src="js/modal.js?v=047864ead8e5ab89"></script>
    <script src="js/mainFunctions.js?v=5978fd60ece90ed4"></script>
    <script src="js/updateManager.js?v=8535c34341d58d54"></script>
    <script src="js/actionButtons.js?v=b4df11b598cd6c2e"></script>
    <script src="js/aetherSidebars.js?v=98c0af0683b7192c"></script>
    <script src="js/eventFunctions.js?v=e97f642d829bbda7"></script>
    <script src="js/eventDetails.js?v=9d97eadb7806cb24"></script>
<script src="js/richTextCharacter.js?v=95f74779301f9030"></script>
</body>
</html>
