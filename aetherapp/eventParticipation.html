<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amarante&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=58e99615809c7b71">
    <title>Aether applicatie</title>
</head>
<body data-sidebar-page="events">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark bgRed mb-4 aether-top-nav" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="index.html" aria-label="Aether startpagina">
                    <img src="img/aether-logo.png" alt="Bootstrap">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item mr-2 d-none" id="navbarAdminItem">
                        <a class="nav-link" id="adminPage" aria-current="page" href="admin.html"><i class="fa-solid fa-shield-halved"></i> Admin</a>
                    </li>
                </ul>
                <div id="navbarName"></div>
            </div>
        </div>
    </nav>

    <template id="eventSidebarContent">
        <div class="mb-3 d-none" id="participantFilterWrapper">
            <label class="form-label" for="eventParticipantSelect">Deelnames van deelnemer</label>
            <div id="eventParticipantFilterChoices"></div>
        </div>
        <div class="company-list event-sidebar-list" id="eventSidebarList"></div>
        <div class="button-group mt-3 d-none" id="eventCreateActions"><button class="action-button" type="button" id="eventCreateButton"><i class="fa-solid fa-plus" aria-hidden="true"></i> Nieuw event</button></div>
    </template>
    <main class="container aether-page event-page">
        <div class="alert alert-danger d-none" id="eventFeedback" role="alert"></div>
        <div id="eventDetailsView" class="d-none"></div>
        <section class="aether-panel d-none" id="eventParticipationView">
            <h1 class="h3 mb-3" id="titleParticipant">Mijn deelnames</h1>
            <div class="table-responsive">
                <table class="table aether-table align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Type</th><th scope="col">Titel</th><th scope="col">Beschrijving</th>
                            <th scope="col">Datum</th><th scope="col">Locatie</th><th scope="col">EP</th><th scope="col">Deelname</th>
                        </tr>
                    </thead>
                    <tbody id="eventList"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/07b82e9825.js" crossorigin="anonymous"></script>
    <script src="js/mainFunctions.js?v=f3db4bd7cb4060d8"></script>
    <script src="js/updateManager.js?v=d4a24e7fe121595f"></script>
    <script src="js/actionButtons.js?v=b4df11b598cd6c2e"></script>
    <script src="js/aetherSidebars.js?v=b1f8f20e0076ee18"></script>
    <script src="js/eventFunctions.js?v=67db78bb33ee6e45"></script>
    <script src="js/eventDetails.js?v=bf4d167e391ce13c"></script>
</body>
</html>
